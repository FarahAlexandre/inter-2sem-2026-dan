<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAN - Login</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
        }

        /* Estilos dos Placeholders da Imagem
        .image-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            width: 100%;
        }*/
        
        .img-top {
            background-color: #1a4454; /* Cor baseada na imagem de cima */
            border-bottom: 4px solid #fff;
        }

        .img-bottom {
            background-color: #0d2c36; /* Cor baseada na imagem de baixo */
        }

        /* Container do Formulário */
        .form-wrapper {
            max-width: 420px;
            width: 100%;
        }

        /* Personalização dos Inputs */
        .input-group-text {
            background-color: #fcfcfc;
            border-radius: 8px 0 0 8px;
            border-color: #ced4da;
        }

        .form-control {
            background-color: #fcfcfc;
            border-radius: 0 8px 8px 0;
            border-color: #ced4da;
            padding-top: 0.6rem;
            padding-bottom: 0.6rem;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #ced4da;
            background-color: #fff;
        }

        .input-group-text i {
            color: #adb5bd;
        }

        /* Personalização do Checkbox */
        .form-check-input {
            background-color: #c4c4c4;
            border-color: #c4c4c4;
        }
        
        .form-check-input:checked {
            background-color: #ffc107;
            border-color: #ffc107;
        }

        /* Personalização do Botão de Entrada */
        .btn-login {
            background-color: #ffca28; /* Amarelo/Laranja da imagem */
            color: #212529;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            padding: 0.75rem;
            box-shadow: 0px 4px 10px rgba(255, 202, 40, 0.4);
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background-color: #ffb300;
            box-shadow: 0px 6px 15px rgba(255, 179, 0, 0.5);
        }

        /* Logo superior direita */
        .logo-container {
            position: absolute;
            top: 2rem;
            right: 3rem;
        }
        
        .logo-text {
            font-size: 1.5rem;
            font-weight: 900;
            color: #223c4a;
            letter-spacing: 1px;
        }
        
        .logo-icon {
            color: #0dcaf0;
            margin-right: 5px;
        }
        .img_log{
            display: block;
            width: 100%;
            margin: 0px auto;
        }
    
        /* Acesso rápido às páginas de cada perfil */
        .btn-persona {
            border: 1px solid #ced4da;
            border-radius: 8px;
            padding: 0.6rem;
            font-weight: 500;
            font-size: 0.9rem;
            color: #212529;
            background-color: #fcfcfc;
            transition: all 0.2s ease;
        }
        .btn-persona:hover {
            border-color: #ffca28;
            background-color: #fff8e1;
            color: #212529;
        }
    </style>
</head>
<body>

<div class="container-fluid vh-100 overflow-hidden">
    <div class="row h-100">
        
        <!-- Lado Esquerdo (Imagens) - Oculto em telas menores que o breakpoint médio (md) -->
        <div class="col-md-6 d-none d-md-flex flex-column p-0 h-100">
            <!-- Placeholder Imagem 1 (Robô de cima) -->
            <div class="image-placeholder img-top flex-grow-1" style="flex-direction: column; justify-content: center; display: flex;">
                <img src = "casa_inteligente.png" />
            </div>
        </div>

        <!-- Lado Direito (Formulário de Login) -->
        <div class="col-12 col-md-6 d-flex position-relative align-items-center justify-content-center bg-white">
            
            <!-- Logotipo "DAN" -->
            <div class="logo-container d-none d-sm-block">
                <span class="logo-text d-flex align-items-center">
                    <img src="logo_dan_branco.jpeg" width="150" />
                    <!--
                    <i class="bi bi-robot logo-icon"></i> DAN
                    -->
                </span>
            </div>

            <!-- Área Central do Formulário -->
            <div class="form-wrapper px-4">
                
                <!-- Títulos -->
                <h2 class="fw-bold text-dark mb-1">Bem-vinda de volta</h2>
                <p class="text-secondary mb-5" style="font-size: 0.95rem;">Entre para continuar configurando seus projetos.</p>

                <!-- Formulário -->
                <form action="#" method="POST" onsubmit="return entrar(event)">
                    
                    <!-- Campo Email -->
                    <div class="mb-4">
                        <label for="emailInput" class="form-label fw-semibold text-dark" style="font-size: 0.9rem;">Login</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="email" class="form-control border-start-0 ps-0" id="emailInput" placeholder="seuemail@exemplo.com" required>
                        </div>
                    </div>

                    <!-- Campo Senha -->
                    <div class="mb-3">
                        <label for="passwordInput" class="form-label fw-semibold text-dark" style="font-size: 0.9rem;">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" class="form-control border-start-0 ps-0" id="passwordInput" placeholder="••••••••" required>
                        </div>
                    </div>

                    <!-- Lembrar de Mim e Esqueceu a Senha -->
                    <div class="d-flex justify-content-between align-items-center mb-5">
                        <div class="form-check">
                            <input class="form-check-input shadow-none" type="checkbox" id="rememberMe">
                            <label class="form-check-label text-secondary" for="rememberMe" style="font-size: 0.9rem;">
                                Lembrar de mim
                            </label>
                        </div>
                        <a href="#" class="text-decoration-none text-dark fw-bold" style="font-size: 0.9rem;">
                            Esqueceu a senha?
                        </a>
                    </div>

                    <div id="erro-login" class="text-danger small mb-3" style="min-height: 1.2em;"></div>

                    <!-- Botão de Entrar -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-login w-100">Entrar</button>
                    </div>

                </form>
            </div>
        </div>
        
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="login.js"></script>

</body>
</html>
